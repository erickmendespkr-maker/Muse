# Build on the isolated translation branch; main remains unchanged.
name: Muse PT-BR APK

# A workflow_dispatch-only workflow cannot be manually started until it exists
# on the default branch. Branch-scoped push enables an immediate isolated build.
on:
  push:
    branches:
      - audit/security-ptbr
    paths:
      - '.github/workflows/ptbr-apk.yml'
      - 'app/src/main/res/**'
      - 'app/src/main/java/io/zer0/muse/intent/**'
      - 'app/src/test/java/io/zer0/muse/intent/**'
      - 'ci/script/check_ptbr_resources.py'
      - 'tools/runtime-pack/build-runtime-pack.sh'
      - 'tools/python-pack/build-python-pack.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ptbr-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}" 
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager || true
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER" || { echo "Android sdkmanager missing at $SDKMANAGER" >&2; exit 1; }
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
      - name: Install Android components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Check pt-BR resources
        run: python3 ci/script/check_ptbr_resources.py
      - name: Set up Node.js for embedded runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build embedded runtime assets
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh arm64
          bash tools/python-pack/build-python-pack.sh arm64
          test -f app/src/main/jniLibs/arm64-v8a/libmuse_node.so
          test -f app/src/main/jniLibs/arm64-v8a/libpython3.14.so
          test -f app/src/main/assets/muse-runtime-assets.zip
          test -f app/src/main/assets/muse-python-assets.zip
      - name: Prepare Gradle
        run: chmod +x ./gradlew
      - name: Test Tasker security guard (JVM)
        run: ./gradlew :app:testDebugUnitTest --tests 'io.zer0.muse.intent.TaskerTriggerGuardTest' -PnoUniversal -PreleaseSkipKeystoreCheck=true --stacktrace
      - name: Compile ARM64 debug APK
        run: ./gradlew :app:assembleDebug -PnoUniversal -PreleaseSkipKeystoreCheck=true --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-ptbr-debug-apks
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
