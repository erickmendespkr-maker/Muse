name: Muse PT-BR APK (manual)

# Manual only: avoid consuming GitHub Actions minutes automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ptbr-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Check pt-BR resources
        run: python3 ci/script/check_ptbr_resources.py
      - name: Set up Node.js for embedded runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build embedded runtime assets
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          bash tools/python-pack/build-python-pack.sh both
      - name: Prepare Gradle
        run: chmod +x ./gradlew
      - name: Compile ARM64 debug APK
        run: ./gradlew :app:assembleDebug -PnoUniversal -PreleaseSkipKeystoreCheck=true --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-ptbr-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
